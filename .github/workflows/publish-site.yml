name: Publish managed static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-managed-static
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game rules and browser syntax
        run: |
          set -euo pipefail
          node --check public/game.js
          node --check tests/real-browser-smoke.cjs
          node --check public/rules.mjs
          node --check public/plunger.mjs
          node --check public/physics-variation.mjs
          node --check public/roulette.mjs
          node --check public/board-layout.mjs
          node --check public/physics-engine.mjs
          node --check public/arcade-feedback.mjs
          node --check public/payout-ceremony.mjs
          node --check public/payout-tray.mjs
          node --check public/payout-basin.mjs
          node --test tests/*.test.mjs
      - name: Stage public static game
        run: |
          set -euo pipefail
          mkdir -p dist
          cp -a public/. dist/
          test -s dist/index.html
          test -s dist/game.js
          test -s dist/rules.mjs
          test -s dist/plunger.mjs
          test -s dist/physics-variation.mjs
          test -s dist/roulette.mjs
          test -s dist/board-layout.mjs
          test -s dist/physics-engine.mjs
          test -s dist/arcade-feedback.mjs
          test -s dist/payout-ceremony.mjs
          test -s dist/payout-tray.mjs
          test -s dist/payout-basin.mjs
          test -s dist/style.css
          test -s dist/mobile.css
          test -s dist/fullscreen.css
          grep -Fq '/games/pinball/' dist/index.html
          ! grep -q 'VITE_SERVER_URL' dist/game.js
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 >/tmp/pinball-http.log 2>&1 &
          python3 - <<'PY'
          from urllib.request import urlopen
          from time import sleep
          for i in range(20):
              try:
                  with urlopen("http://127.0.0.1:8765/") as r:
                      html=r.read().decode()
                  assert '星运弹珠局' in html
                  break
              except OSError:
                  sleep(.2)
          else:
              raise SystemExit("Static preview failed")
          for path in ("game.js","rules.mjs","plunger.mjs","physics-variation.mjs","roulette.mjs","board-layout.mjs","physics-engine.mjs","arcade-feedback.mjs","payout-ceremony.mjs","payout-tray.mjs","payout-basin.mjs","style.css","mobile.css","fullscreen.css"):
              with urlopen("http://127.0.0.1:8765/"+path) as r:
                  assert r.status==200
          PY
      - name: Real Chromium smoke (Canvas and mobile)
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install chromium
          mkdir -p /tmp/pinball-smoke/games
          ln -s "$GITHUB_WORKSPACE/dist" /tmp/pinball-smoke/games/pinball
          python3 -m http.server 8766 --directory /tmp/pinball-smoke --bind 127.0.0.1 >/tmp/pinball-smoke-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/games/pinball/ >/dev/null; then break; fi
            sleep .2
          done
          node tests/real-browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinball-browser-screens
          path: /tmp/pinball-*.png
          if-no-files-found: ignore
          retention-days: 2
      - name: Publish current main build to site
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main advanced; skip publishing outdated build"
            exit 0
          fi
          target="$RUNNER_TEMP/pinball-site"
          if git ls-remote --exit-code origin refs/heads/site >/dev/null; then
            git fetch origin refs/heads/site
            git worktree add --detach "$target" FETCH_HEAD
            git -C "$target" switch -C site
          else
            git worktree add --detach "$target" HEAD
            git -C "$target" switch --orphan site
          fi
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a dist/. "$target/"
          printf '%s\n' "$GITHUB_SHA" > "$target/.source-sha"
          printf 'portal-managed-static-v1\n' > "$target/.site-kind"
          printf 'pinball\n' > "$target/.site-slug"
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add -A
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m "deploy: pinball from $GITHUB_SHA"
            git -C "$target" push origin HEAD:refs/heads/site
          fi
