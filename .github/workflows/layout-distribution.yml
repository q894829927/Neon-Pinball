name: Pinboard layout distribution audit

on:
  push:
    branches: [main]
    paths:
      - "public/board-layout.mjs"
      - "public/physics-engine.mjs"
      - "scripts/layout-distribution.mjs"
      - ".github/workflows/layout-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo:
    name: 3000 physical launches - ${{ matrix.layout }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        layout: [classic, mirror, dense, wave, balanced]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual 180Hz physics, paired seeded trials
        env:
          LAYOUT_ID: ${{ matrix.layout }}
          LAYOUT_SHOTS: "3000"
          LAYOUT_MAX_STEPS: "5400"
        run: |
          set -euo pipefail
          node scripts/layout-distribution.mjs
      - name: Save layout samples
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.layout }}
          path: layout-distribution-output/
          retention-days: 60

  report:
    needs: [monte-carlo]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gather test outputs
        uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          path: layouts
          merge-multiple: true
      - name: Create slot-frequency comparison report
        run: |
          python3 - <<'PY'
          import json,os,pathlib,csv
          folder=pathlib.Path("layouts")
          paths=sorted(folder.glob("*.json"))
          ids=["classic","mirror","dense","wave","balanced"]
          data={p.stem:json.loads(p.read_text()) for p in paths}
          if set(data)!=set(ids):
              raise SystemExit("Missing layout results: "+str(set(ids)-set(data)))
          if data["balanced"]["invalid"] or data["balanced"]["timeouts"]:
              raise SystemExit("Balanced geometry has physically unsettled shots")
          if data["balanced"]["totalVariationFromUniformPct"]>=data["classic"]["totalVariationFromUniformPct"]:
              raise SystemExit("Balanced geometry is no more uniform than original on this benchmark")
          result=["# 钉阵布局落点分布对比","",
            "基于正式 180Hz 物理引擎，5 种布局各 3000 次随机发射；使用相同种子和均匀覆盖的 20 档发射力度。","",
            "下表为观察频率，不是修改后的中奖赔率。","",
            "| 指标 | 经典错列 | 反向错列 | 密集钉阵 | 波浪钉阵 | 均衡导流 |",
            "|---|---:|---:|---:|---:|---:|"]
          def row(label,key,suffix=""):
              return "| "+label+" | "+" | ".join(str(data[i][key])+suffix for i in ids)+" |"
          result+=[row("有效落槽次数","settled"),row("异常发射","invalid"),
            row("最高频槽位","maxSlotIndex"),row("最高频槽占比","maxSlotPct","%"),
            row("首尾槽合计","edgeSlotsPct","%"),
            row("右侧五槽合计","rightFiveSlotsPct","%"),
            row("对均匀分布的总变差距离","totalVariationFromUniformPct","%"),
            row("平均碰撞次数","meanImpacts"),""]
          result+=["## 11 个槽位的落点概率","",
            "| 槽位 | "+" | ".join(data[i]["name"] for i in ids)+" |",
            "|---|---:|---:|---:|---:|"]
          for i in range(11):
              result.append("| "+str(i+1)+" | "+" | ".join(str(data[id]["percent"][i])+"%" for id in ids)+" |")
          result+=["","## 方法与限制","",
           "- 发射力度在20档之间均衡取样，各布局均使用相同发射力度序列与随机种子。",
           "- 每次最多5400个1/180秒物理步，统计真正的物理落槽，未作命中调整。",
           "- 平均11槽的理论均匀参考值为9.091%，不意味着物理必然均匀。",
           "- 结果受发射力度分布和随机扰动设置影响，实际玩家操作分布可能不同。",
           "- 单一槽位概率的95%抽样误差通常约为±1.0个百分点（概率接近9%，n=3000）。",""]
          pathlib.Path("layout-distribution-report.md").write_text("\n".join(result))
          with open("layout-distribution-comparison.csv","w",newline="") as f:
              w=csv.writer(f);w.writerow(["slot",*ids])
              for i in range(11):w.writerow([i+1,*[data[id]["percent"][i] for id in ids]])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n".join(result)+"\n")
          print("\n".join(result))
          PY
      - name: Upload combined comparison
        uses: actions/upload-artifact@v4
        with:
          name: layout-distribution-comparison
          path: |
            layout-distribution-report.md
            layout-distribution-comparison.csv
          retention-days: 60
